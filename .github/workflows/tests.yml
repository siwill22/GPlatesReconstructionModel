name: tests

on:
  push:
    branches: [master, claude_revision]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.10', '3.12']

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install
        # GMT itself is not installed: pygmt's wheel imports without it, and nothing in the
        # test suite calls pygmt. That is only true because pygmt is imported at its points
        # of use rather than at module level, which test_import_contract.py enforces.
        run: |
          python -m pip install --upgrade pip
          python -m pip install .
          python -m pip install pytest

      - name: Run tests
        run: python -m pytest tests/ -v --deselect tests/test_network.py

  network:
    # Split out because a failure here means an upstream dataset URL has rotted, which is
    # worth knowing about but is not a defect in gprm, and should not redden the main job.
    runs-on: ubuntu-latest
    continue-on-error: true

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install .
          python -m pip install pytest

      - name: Check dataset URLs are still alive
        run: python -m pytest tests/test_network.py -v -m network
