[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "gprm"
version = "0.1.1"
description = "Tools for building and working with GPlates plate tectonic reconstruction models"
readme = "README.md"
license = "MIT"
requires-python = ">=3.8"
authors = [
    { name = "Simon Williams", email = "siwill22@gmail.com" },
]
classifiers = [
    "Intended Audience :: Science/Research",
    "Intended Audience :: Developers",
    "Natural Language :: English",
    "Operating System :: OS Independent",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering",
]
dependencies = [
    "numpy",
    "scipy",  # cKDTree backs the great-circle proximity engine in utils.proximity
    "pandas",
    "geopandas",
    "shapely",
    "matplotlib",
    "xarray",
    "pygplates",
    "PlateTectonicTools",  # ships no wheel (sdist only); pip builds it locally every install.
                          # No compiler/system library needed -- it's pure Python -- so this is
                          # slower, not riskier, but don't expect an instant wheel pull for it.
    "pooch",
    "rasterio",
    "requests",
    "openpyxl",  # pandas.read_excel, for the PaleoReefs (PARED) spreadsheet
    "tqdm",
    "pyyaml",
    # Required, not just defensive: PlateTectonicTools imports pkg_resources unconditionally at
    # module load (ptt/documentation.py) but does not declare setuptools as its own dependency,
    # and a modern `python -m venv` does not bundle setuptools by default. Without this pin, a
    # fresh install has no pkg_resources at all and `import ptt` raises ModuleNotFoundError
    # immediately -- not the deprecation warning the version cap below is about avoiding.
    # Verified empirically (clean venv, setuptools absent -> that exact crash).
    "setuptools<80",  # >=80 removes pkg_resources outright, which still gives an ImportError
    "cartopy",  # PlateTectonicTools imports this unconditionally at module level
]

[project.urls]
Homepage = "https://github.com/siwill22/GPlatesReconstructionModel"

[project.optional-dependencies]
# pygmt is optional because it needs the GMT command-line library, which pip cannot install.
# Nothing on the data-preparation or analysis path imports it -- fetching models, assigning
# plate ids, reconstructing, plate snapshots and all proximity calculations work without it,
# so a headless machine does not need GMT at all.
viz = ["pygmt"]
geophysics = ["pyshtools", "litho1pt0", "pmagpy"]
# xarray-spatial's only caller, utils.proximity.generate_shadows, has been removed (it never
# returned a value): the proximity/distance functions use scipy's cKDTree directly, and
# neither xarray-spatial nor datashader is imported anywhere now.
spatial = ["astropy-healpix", "scikit-image", "scikit-learn"]
all = ["gprm[viz,geophysics,spatial]"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# Network tests are opt-in: run them with `pytest -m network`. A failure there means an
# upstream dataset URL has rotted, not that gprm is broken.
addopts = "-m 'not network'"
markers = [
    "network: requires internet access to reach published dataset URLs",
]

[tool.setuptools.packages.find]
include = ["gprm*"]

[tool.setuptools.package-data]
gprm = ["Data/*.gpmlz", "Data/*.gpkg"]
